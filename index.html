<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="学習計画">
<meta name="theme-color" content="#f6f1e7">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>学習計画</title>
<style>
:root{--paper:#f6f1e7;--ink:#26324a;--sub:#7a7f8c;--line:#ddd5c3;--card:#fffdf8;--green:#cfe8c9;--greenb:#5a9a56;--acc:#2f5d8a}
@media(prefers-color-scheme:dark){:root{--paper:#1c1f26;--ink:#e8e6df;--sub:#9a9ea8;--line:#3a3f4a;--card:#262a33;--green:#2f4a2e;--greenb:#6fb36a;--acc:#7fb0e0}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;font-size:16px}
#main{padding:env(safe-area-inset-top) 14px 96px;max-width:640px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:12px 0 4px}
#title{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:700 22px/1.3 "Hiragino Mincho ProN","Yu Mincho",serif;border-bottom:1px dashed var(--line);padding:2px 0}
.zb{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;font-weight:700}
#curbook{display:block;border:0;background:none;color:var(--acc);font-size:14px;font-weight:600;margin:0 0 10px;padding:4px 0;text-align:left}
section{display:none}section.on{display:block}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px}
.row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.row>*{min-width:0}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px}
textarea{min-height:90px}
button{font:inherit;cursor:pointer}
.btn{border:0;background:var(--acc);color:#fff;border-radius:8px;padding:10px 16px;font-weight:700;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.btn.del{background:#b4473d}
.btn.sm{padding:6px 12px;font-weight:600}
.btn.on{background:var(--acc);color:#fff}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:8px}
.seg button{flex:1;border:0;background:none;color:var(--ink);padding:9px;font-weight:600}
.seg button.on{background:var(--acc);color:#fff}
.plus{flex:none;width:38px;height:38px;border-radius:8px;border:1px solid var(--acc);background:none;color:var(--acc);font-size:20px;padding:0}
.nd{margin-bottom:8px}
.kids{margin-left:12px;padding-left:8px;border-left:2px solid var(--line);margin-top:6px}
.nrow{display:flex;align-items:center;gap:6px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.nrow.top{border-width:2px;background:rgba(47,93,138,.1)}
.nrow.done{background:var(--green);border-color:var(--greenb)}
.tg{flex:none;width:30px;height:32px;border:0;background:none;color:var(--ink);font-size:14px;padding:0}
.ibody{flex:1;min-width:0;padding:2px 0;cursor:pointer}
.iname{font-weight:600;word-break:break-all}
.nrow.top .iname{font-weight:700}
.idate{font-size:12px;color:var(--sub)}
.imemo{font-size:13px;color:var(--sub);white-space:pre-wrap;word-break:break-all;margin-top:2px;max-height:3.9em;overflow:hidden}
.cnt{font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums;font-size:14px}
.ib{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;min-width:34px;height:32px;font-size:14px}
a{color:var(--acc);text-decoration:underline}
.empty{color:var(--sub);text-align:center;padding:30px 10px;line-height:1.7}
.sw{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 12px}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
.sw button.sel{border-color:var(--ink)}
.shelf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.book{position:relative;border-radius:4px 10px 10px 4px;padding:16px 12px 12px 20px;min-height:130px;color:#fff;box-shadow:inset 8px 0 0 rgba(0,0,0,.18),0 2px 4px rgba(0,0,0,.2);display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.book b{font-size:16px;line-height:1.4;word-break:break-all;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.book small{opacity:.9}
.book .ib{align-self:flex-end;background:rgba(255,255,255,.25);color:#fff;border-color:rgba(255,255,255,.5)}
.book.cur{outline:3px solid var(--ink);outline-offset:2px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--sub);padding:10px 0 8px;font-size:12px;font-weight:600}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--acc)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
#modal.on{display:flex}
#sheet{background:var(--card);width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:90%;overflow:auto}
#sheet h3{margin:0 0 10px;font-size:17px}
.l{display:block;font-size:13px;color:var(--sub);margin:8px 0 4px}
.small{font-size:12px;color:var(--sub);line-height:1.6}
.pv{background:var(--paper);border:1px dashed var(--line);border-radius:8px;padding:8px;font-weight:700;margin:4px 0 8px}
</style>
</head>
<body>
<div id="main">
  <header>
    <input id="title" aria-label="タイトル" maxlength="30">
    <button class="zb" id="zo" aria-label="縮小">A−</button>
    <button class="zb" id="zi" aria-label="拡大">A+</button>
  </header>
  <button id="curbook"></button>

  <section id="s-text">
    <div class="panel" id="addp">
      <label class="l" style="margin-top:0">追加する場所</label>
      <select id="parentSel" style="margin-bottom:8px"></select>
      <div id="ed"></div>
      <button class="btn" id="addBtn" style="width:100%">追加</button>
      <div class="row" style="margin:10px 0 0;flex-wrap:wrap">
        <button class="btn ghost sm" id="reBtn">並べ替え</button>
        <button class="btn ghost sm" id="openAll">すべて展開</button>
        <button class="btn ghost sm" id="closeAll">すべて折りたたむ</button>
      </div>
    </div>
    <div id="tree"></div>
  </section>

  <section id="s-make">
    <div class="panel">
      <label class="small">教科書の名称</label>
      <input id="bookName" placeholder="例：一級建築士 法規" maxlength="40" style="margin:4px 0 10px">
      <label class="small">本の色</label>
      <div class="sw" id="swMake"></div>
      <button class="btn" id="makeBtn" style="width:100%">教科書を作成</button>
    </div>
  </section>

  <section id="s-shelf">
    <div id="shelf"></div>
    <div class="panel" style="margin-top:18px">
      <div class="small" style="margin-bottom:8px">データはこの端末のSafariに保存されます。念のためバックアップを残せます。</div>
      <div class="row" style="margin:0"><button class="btn ghost" id="exBtn" style="flex:1">書き出し</button><button class="btn ghost" id="imBtn" style="flex:1">読み込み</button></div>
      <input type="file" id="imFile" accept="application/json,.json" style="display:none">
    </div>
  </section>
</div>

<nav>
  <button data-tab="text"><span>📖</span>教科書</button>
  <button data-tab="make"><span>✏️</span>作成</button>
  <button data-tab="shelf"><span>📚</span>本棚</button>
</nav>
<div id="modal"><div id="sheet"></div></div>

<script>
(function(){
var K='gakushu_v1',COLORS=['#2f5d8a','#b4473d','#3f8a5a','#c98a2b','#7a4f9a','#3b8c96','#8a5a44','#4a4f5c'];
var DU=['編','章','節','款','条','項','号','部','単元','問'],DL=['法','政令','省令','告示','条例','規則'];
var S=migrate(load()),tab='text',reorder=false,mkColor=COLORS[0];
var form={t:'n',unit:'章',num:1,name:'',law:'法',parts:[['条',1]],parent:''};
var $=function(s){return document.querySelector(s)};
function load(){var ks=[K,K+'_bak'];for(var i=0;i<ks.length;i++){try{var d=JSON.parse(localStorage.getItem(ks[i]));if(d&&d.books)return d}catch(e){}}return{title:'学習計画',books:[],cur:null,zoom:1}}
function migrate(d){
  d.units=d.units||DU.slice();d.laws=d.laws||DL.slice();
  d.books.forEach(function(b){
    if(b.chapters){b.nodes=b.chapters.map(function(c){return mk({t:'n',unit:'',num:0,name:c.name,ch:c.items.map(function(x){return mk({t:'n',unit:'',num:0,name:x.name,date:x.date,memo:x.memo})})})});delete b.chapters}
    b.nodes=b.nodes||[];
  });
  return d;
}
function mk(o){return{id:o.id||uid(),t:o.t||'n',unit:o.unit||'',num:o.num||0,name:o.name||'',law:o.law||'',parts:o.parts||[],date:o.date||'',memo:o.memo||'',open:o.open!==false,ch:o.ch||[]}}
function save(){try{var o=localStorage.getItem(K);if(o)localStorage.setItem(K+'_bak',o);localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('保存に失敗しました。空き容量を確認してください。')}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function link(s){return esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener" data-lk="1">$1</a>')}
function book(){for(var i=0;i<S.books.length;i++)if(S.books[i].id===S.cur)return S.books[i];return null}
function mv(a,i,d){var j=i+d;if(j<0||j>=a.length)return;var t=a[i];a[i]=a[j];a[j]=t}
function fmt(d){if(!d)return'';var p=d.split('-');return p[0]+'年'+(+p[1])+'月'+(+p[2])+'日'}
function label(n){
  if(n.t==='l')return n.law+n.parts.map(function(p){return'第'+p[1]+p[0]}).join('');
  return(n.num?n.num+n.unit:'')+(n.name?(n.num?' ':'')+n.name:'')||'(無題)';
}
function cmp(a,b){
  var x=S.laws.indexOf(a.law),y=S.laws.indexOf(b.law);if(x!==y)return x-y;
  for(var i=0;i<Math.max(a.parts.length,b.parts.length);i++){
    if(!a.parts[i])return-1;if(!b.parts[i])return 1;
    if(a.parts[i][1]!==b.parts[i][1])return a.parts[i][1]-b.parts[i][1];
  }return 0;
}
function sortLaw(arr){
  var idx=[],ns=[];arr.forEach(function(n,i){if(n.t==='l'){idx.push(i);ns.push(n)}});
  ns.sort(cmp);idx.forEach(function(p,k){arr[p]=ns[k]});
}
function stat(n){var d=0,t=0;n.ch.forEach(function(c){if(c.ch.length){var s=stat(c);d+=s.d;t+=s.t}else{t++;if(c.date)d++}});return{d:d,t:t}}
function locate(id,arr){arr=arr||book().nodes;for(var i=0;i<arr.length;i++){if(arr[i].id===id)return{n:arr[i],arr:arr,i:i};var r=locate(id,arr[i].ch);if(r)return r}return null}
function walk(arr,fn,dep){dep=dep||0;arr.forEach(function(n){fn(n,dep);walk(n.ch,fn,dep+1)})}

function render(){
  $('#title').value=S.title;document.title=S.title;
  $('#main').style.zoom=S.zoom;
  var b=book();
  $('#curbook').textContent=b?'📖 '+b.name+'  ✎ 名前を編集':'';
  $('#curbook').style.display=b?'':'none';
  ['text','make','shelf'].forEach(function(t){$('#s-'+t).classList.toggle('on',t===tab)});
  document.querySelectorAll('nav button').forEach(function(x){x.classList.toggle('on',x.dataset.tab===tab)});
  renderText();renderMake();renderShelf();
}

function nodeHTML(n,arr,i,dep){
  var has=n.ch.length>0,s=has?stat(n):null,done=has?(s.t>0&&s.d===s.t):!!n.date;
  var h='<div class="nd"><div class="nrow'+(dep===0?' top':'')+(done?' done':'')+'">'+
    (has?'<button class="tg" data-act="tg" data-id="'+n.id+'">'+(n.open?'▼':'▶')+'</button>':'<span class="tg"></span>')+
    '<div class="ibody" data-act="edit" data-id="'+n.id+'"><div class="iname">'+esc(label(n))+'</div>'+(n.date?'<div class="idate">✔ '+fmt(n.date)+'</div>':'')+(n.memo?'<div class="imemo">'+link(n.memo)+'</div>':'')+'</div>'+
    (has?'<div class="cnt">'+s.d+'/'+s.t+'</div>':'')+
    (reorder&&n.t!=='l'?'<button class="ib" data-act="up" data-id="'+n.id+'">▲</button><button class="ib" data-act="dn" data-id="'+n.id+'">▼</button>':'')+'</div>';
  if(has&&n.open)h+='<div class="kids">'+n.ch.map(function(c,j){return nodeHTML(c,n.ch,j,dep+1)}).join('')+'</div>';
  return h+'</div>';
}

function renderText(){
  var b=book(),t=$('#tree');
  $('#addp').style.display=b?'':'none';
  $('#reBtn').classList.toggle('on',reorder);
  if(!b){t.innerHTML='<div class="empty">教科書がまだありません。<br>「作成」タブで作るか、「本棚」から選んでください。</div>';return}
  var o='<option value="">最上位</option>';
  walk(b.nodes,function(n,d){o+='<option value="'+n.id+'">'+'　'.repeat(d)+esc(label(n))+'</option>'});
  var ps=$('#parentSel');ps.innerHTML=o;
  if(form.parent&&!locate(form.parent))form.parent='';
  ps.value=form.parent;
  editor($('#ed'),form);
  t.innerHTML=b.nodes.length?b.nodes.map(function(n,i){return nodeHTML(n,b.nodes,i,0)}).join(''):'<div class="empty">上のフォームから、最初の階層を追加しましょう。<br>（例：1章、第1編 など）</div>';
}

function opts(arr,sel){return arr.map(function(x){return'<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>'}).join('')}
function nums(max,sel,none){var h=none?'<option value="0"'+(!sel?' selected':'')+'>なし</option>':'';for(var i=1;i<=max;i++)h+='<option value="'+i+'"'+(i===sel?' selected':'')+'>'+i+'</option>';return h}

function editor(host,st){
  var h='<div class="seg"><button data-f="type" data-v="n" class="'+(st.t==='n'?'on':'')+'">通常</button><button data-f="type" data-v="l" class="'+(st.t==='l'?'on':'')+'">法令</button></div>';
  if(st.t==='n'){
    h+='<div class="row"><select data-f="num" style="flex:1">'+nums(99,st.num,true)+'</select><select data-f="unit" style="flex:1">'+'<option value=""'+(!st.unit?' selected':'')+'>単位なし</option>'+opts(S.units,st.unit)+'</select><button class="plus" data-f="addunit" aria-label="単位を追加">＋</button></div>'+
      '<input data-f="name" placeholder="名称（任意）" maxlength="60" value="'+esc(st.name)+'" style="margin-bottom:8px">';
  }else{
    h+='<div class="row"><select data-f="law" style="flex:1">'+opts(S.laws,st.law)+'</select><button class="plus" data-f="addlaw" aria-label="法令名を追加">＋</button></div>';
    st.parts.forEach(function(p,i){
      h+='<div class="row"><span>第</span><select data-f="pn" data-i="'+i+'" style="flex:1">'+nums(300,p[1])+'</select><select data-f="pu" data-i="'+i+'" style="flex:1">'+opts(S.units,p[0])+'</select>'+(st.parts.length>1?'<button class="plus" data-f="pdel" data-i="'+i+'" style="font-size:14px">✕</button>':'')+'</div>';
    });
    h+='<button class="btn ghost sm" data-f="padd" style="margin-bottom:8px">＋ 項・号などを追加</button><div class="pv">'+esc(label(st))+'</div>';
  }
  host.innerHTML=h;
  var re=function(){editor(host,st)};
  host.onclick=function(e){
    var b=e.target.closest('[data-f]');if(!b)return;var f=b.dataset.f,i=+b.dataset.i;
    if(f==='type'){st.t=b.dataset.v;re()}
    else if(f==='addunit'){var v=(prompt('新しい単位を入力（例：節、講、回）')||'').trim();if(v){if(S.units.indexOf(v)<0)S.units.push(v);st.unit=v;save();re()}}
    else if(f==='addlaw'){var w=(prompt('新しい法令名を入力（例：施行規則、告示）')||'').trim();if(w){if(S.laws.indexOf(w)<0)S.laws.push(w);st.law=w;save();re()}}
    else if(f==='pdel'){st.parts.splice(i,1);re()}
    else if(f==='padd'){var last=st.parts[st.parts.length-1][0],k=S.units.indexOf(last);st.parts.push([S.units[k+1]||'項',1]);re()}
  };
  host.onchange=function(e){
    var f=e.target.dataset.f,i=+e.target.dataset.i,v=e.target.value;
    if(f==='num')st.num=+v;else if(f==='unit')st.unit=v;else if(f==='law')st.law=v;
    else if(f==='pn')st.parts[i][1]=+v;else if(f==='pu')st.parts[i][0]=v;
    else return;
    re();
  };
  host.oninput=function(e){if(e.target.dataset.f==='name')st.name=e.target.value};
}

function modal(h){$('#sheet').innerHTML=h;$('#modal').classList.add('on')}
function closeM(){$('#modal').classList.remove('on')}

function nodeModal(id){
  var r=locate(id),n=r.n;
  var st={t:n.t,unit:n.unit,num:n.num,name:n.name,law:n.law||S.laws[0],parts:n.parts.length?n.parts.map(function(p){return p.slice()}):[['条',1]]};
  modal('<h3>編集</h3><div id="m-ed"></div><label class="l">学習した日付</label><div class="row"><input type="date" id="m-date" value="'+esc(n.date)+'"><button class="btn ghost sm" id="m-today">今日</button></div><label class="l">メモ（URLはリンクになります）</label><textarea id="m-memo">'+esc(n.memo)+'</textarea><div class="small" id="m-links"></div><div class="row" style="margin-top:10px"><button class="btn ghost sm" id="m-child" style="flex:1">この下に追加</button></div><div class="row"><button class="btn del" id="m-del">削除</button><button class="btn ghost" id="m-cancel" style="flex:1">閉じる</button><button class="btn" id="m-save" style="flex:1">保存</button></div>');
  editor($('#m-ed'),st);
  var show=function(){var m=$('#m-memo').value;$('#m-links').innerHTML=/https?:\/\//.test(m)?'リンク：<br>'+link(m).split('\n').filter(function(l){return l.indexOf('<a')>-1}).join('<br>'):''};
  show();$('#m-memo').oninput=show;
  $('#m-today').onclick=function(){var d=new Date();$('#m-date').value=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)};
  $('#m-cancel').onclick=closeM;
  $('#m-child').onclick=function(){form.parent=n.id;n.open=true;save();closeM();render();window.scrollTo(0,0)};
  $('#m-save').onclick=function(){
    n.t=st.t;n.unit=st.unit;n.num=st.num;n.name=st.name.trim();n.law=st.law;n.parts=st.t==='l'?st.parts:[];
    n.date=$('#m-date').value;n.memo=$('#m-memo').value;sortLaw(r.arr);save();closeM();render();
  };
  $('#m-del').onclick=function(){
    var c=0;walk(n.ch,function(){c++});
    if(confirm(c?'この項目と下位の'+c+'件も削除しますか？':'この項目を削除しますか？')){r.arr.splice(r.i,1);save();closeM();render()}
  };
}
function bookModal(bid){
  var b=S.books.filter(function(x){return x.id===bid})[0],col=b.color;
  modal('<h3>教科書を編集</h3><label class="l">名称</label><input id="m-name" value="'+esc(b.name)+'"><label class="l">本の色</label><div class="sw" id="m-sw"></div><div class="row"><button class="btn del" id="m-del">削除</button><button class="btn ghost" id="m-cancel" style="flex:1">閉じる</button><button class="btn" id="m-save" style="flex:1">保存</button></div>');
  var paint=function(){$('#m-sw').innerHTML=COLORS.map(function(c){return'<button data-col="'+c+'" class="'+(c===col?'sel':'')+'" style="background:'+c+'"></button>'}).join('')};
  paint();
  $('#m-sw').onclick=function(e){var c=e.target.dataset.col;if(c){col=c;paint()}};
  $('#m-cancel').onclick=closeM;
  $('#m-save').onclick=function(){b.name=$('#m-name').value.trim()||b.name;b.color=col;save();closeM();render()};
  $('#m-del').onclick=function(){if(confirm('「'+b.name+'」を削除しますか？中のデータも消えます。')){S.books=S.books.filter(function(x){return x!==b});if(S.cur===b.id)S.cur=S.books.length?S.books[0].id:null;save();closeM();render()}};
}

function renderMake(){$('#swMake').innerHTML=COLORS.map(function(c){return'<button data-act="mk" data-col="'+c+'" class="'+(c===mkColor?'sel':'')+'" style="background:'+c+'" aria-label="色"></button>'}).join('')}
function renderShelf(){
  var h=$('#shelf');
  if(!S.books.length){h.innerHTML='<div class="empty">本棚は空です。<br>「作成」タブで教科書を作りましょう。</div>';return}
  h.innerHTML='<div class="shelf">'+S.books.map(function(b){
    var s=stat({ch:b.nodes});
    return'<div class="book'+(b.id===S.cur?' cur':'')+'" style="background:'+b.color+'" data-act="open" data-b="'+b.id+'"><b>'+esc(b.name)+'</b><small>'+s.d+'/'+s.t+' 学習済み</small><button class="ib" data-act="bedit" data-b="'+b.id+'">編集</button></div>'}).join('')+'</div>';
}

document.addEventListener('click',function(e){
  if(e.target.closest('a[data-lk]'))return;
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act;
  if(a==='tg'){var r=locate(el.dataset.id);r.n.open=!r.n.open;save();render()}
  else if(a==='edit')nodeModal(el.dataset.id);
  else if(a==='up'||a==='dn'){var q=locate(el.dataset.id);mv(q.arr,q.i,a==='up'?-1:1);sortLaw(q.arr);save();render()}
  else if(a==='mk'){mkColor=el.dataset.col;renderMake()}
  else if(a==='bedit'){e.stopPropagation();bookModal(el.dataset.b)}
  else if(a==='open'){S.cur=el.dataset.b;save();tab='text';render();window.scrollTo(0,0)}
});
$('#modal').addEventListener('click',function(e){if(e.target.id==='modal')closeM()});
$('#curbook').onclick=function(){if(S.cur)bookModal(S.cur)};
document.querySelectorAll('nav button').forEach(function(x){x.onclick=function(){tab=x.dataset.tab;render();window.scrollTo(0,0)}});
$('#parentSel').onchange=function(){form.parent=this.value};
$('#reBtn').onclick=function(){reorder=!reorder;render()};
function setAll(v){walk(book().nodes,function(n){n.open=v});save();render()}
$('#openAll').onclick=function(){setAll(true)};
$('#closeAll').onclick=function(){setAll(false)};
$('#title').onchange=function(){S.title=this.value.trim()||'学習計画';save();render()};
$('#zi').onclick=function(){S.zoom=Math.min(1.8,Math.round((S.zoom+0.1)*10)/10);save();render()};
$('#zo').onclick=function(){S.zoom=Math.max(0.7,Math.round((S.zoom-0.1)*10)/10);save();render()};

$('#addBtn').onclick=function(){
  var b=book();if(!b)return;
  var n=mk({t:form.t,unit:form.unit,num:form.num,name:form.name.trim(),law:form.law,parts:form.t==='l'?form.parts.map(function(p){return p.slice()}):[]});
  if(form.t==='n'&&!n.num&&!n.name){alert('数字か名称を入力してください');return}
  var arr=b.nodes;
  if(form.parent){var p=locate(form.parent);p.n.open=true;arr=p.n.ch}
  arr.push(n);sortLaw(arr);
  form.name='';
  if(form.t==='n'&&form.num)form.num=Math.min(99,form.num+1);
  if(form.t==='l')form.parts[form.parts.length-1][1]++;
  save();render();
};
$('#makeBtn').onclick=function(){
  var n=$('#bookName').value.trim();if(!n){alert('名称を入力してください');return}
  var b={id:uid(),name:n,color:mkColor,nodes:[]};S.books.push(b);S.cur=b.id;
  $('#bookName').value='';save();tab='text';render();
};
$('#exBtn').onclick=function(){
  var u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'})),a=document.createElement('a');
  a.href=u;a.download='gakushu-backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},3000);
};
$('#imBtn').onclick=function(){$('#imFile').click()};
$('#imFile').onchange=function(){
  var f=this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var d=JSON.parse(r.result);if(!d.books)throw 0;if(confirm('現在のデータを置き換えて読み込みますか？')){S=migrate(d);save();render()}}catch(e){alert('読み込めないファイルです')}};
  r.readAsText(f);this.value='';
};

if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker'in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js')});
render();
})();
</script>
</body>
</html>
